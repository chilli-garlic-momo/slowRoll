[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowroll"
version = "0.1.0"
description = "Health-gated progressive rollout for self-hosted Flagsmith"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp"]

[project.scripts]
slowroll = "slowroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
